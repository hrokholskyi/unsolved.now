# unsolved.now — Jekyll configuration
# Built for the native GitHub Pages branch build (no Actions, no plugins).

title: unsolved.now
tagline: A catalog of everything we don't know
description: >-
  The great unsolved problems of mathematics, physics, chemistry, and
  engineering — how long they've been open, why they resist, and what
  happens when they fall. Every claim cited to an authoritative source.
url: "https://unsolved.now"
baseurl: ""

repository_url: "https://github.com/hrokholskyi/unsolved.now"
# "Suggest a problem" CTA — GitHub Issue Form, preselected via template param.
submit_url: "https://github.com/hrokholskyi/unsolved.now/issues/new?template=suggest-problem.yml"
issues_enabled: true

# Follow-updates form endpoint (e.g. Buttondown/Formspree POST URL).
# OWNER TODO: create an endpoint and set it here. While empty, the site
# renders a mailto: fallback instead of a dead form.
form_endpoint: ""
contact_email: "roman.hrokholskyi@gmail.com"

collections:
  problems:
    output: true
    permalink: /problems/:name/

defaults:
  - scope:
      path: ""
      type: problems
    values:
      layout: problem

# Fields: machine key -> display label.
# Adding a field here makes it appear in the landing-page filter.
fields:
  mathematics: "Mathematics"
  physics: "Physics"
  chemistry: "Chemistry"
  engineering-ai: "Engineering & AI"

markdown: kramdown

exclude:
  - README.md
  - CLAUDE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
